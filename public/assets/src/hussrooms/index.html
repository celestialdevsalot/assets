
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		body {
			color: white;
			background-color: black;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
		}

		#canvas:focus {
			outline: none;
		}

		#status, #status-splash, #status-progress {
			position: absolute;
			left: 0;
			right: 0;
		}

		#status, #status-splash {
			top: 0;
			bottom: 0;
		}

		#status {
			background-color: #242424;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			visibility: hidden;
		}

		#status-splash {
			max-height: 100%;
			max-width: 100%;
			margin: auto;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-splash.fullsize--true {
			height: 100%;
			width: 100%;
			object-fit: contain;
		}

		#status-splash.use-filter--false {
			image-rendering: pixelated;
		}

		#status-progress, #status-notice {
			display: none;
		}

		#status-progress {
			bottom: 10%;
			width: 50%;
			margin: 0 auto;
		}

		#status-notice {
			background-color: #5b3943;
			border-radius: 0.5rem;
			border: 1px solid #9b3943;
			color: #e0e0e0;
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			line-height: 1.3;
			margin: 0 2rem;
			overflow: hidden;
			padding: 1rem;
			text-align: center;
			z-index: 1;
		}
	</style>
</head>

<body>

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<img
			id="status-splash"
			class="show-image--true fullsize--true use-filter--true"
			src="index.png"
			alt=""
		>
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>

	<script>
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "index",
			"experimentalVK": false,
			"fileSizes": {
				"index.pck": 94844896,
				"index.wasm": 39513091
			},
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4
		};

		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		/*
		 * Hussrooms large files are hosted through jsDelivr.
		 * The normal HTML/JS/assets are on PLEXILE ARCADE.
		 */
		const CDN_BASE =
			"https://cdn.jsdelivr.net/gh/knwzero/Hussrooms-Web@main/";

		const originalFetch = window.fetch.bind(window);

		function getParts(file, start, end) {
			const parts = [];

			for (let i = start; i <= end; i++) {
				parts.push(CDN_BASE + file + ".part" + i);
			}

			return parts;
		}

		async function mergeFiles(fileParts) {
			const buffers = [];

			for (const part of fileParts) {
				const response = await originalFetch(part);

				if (!response.ok) {
					throw new Error(
						"Failed to load game file part: " + part
					);
				}

				const data = await response.arrayBuffer();
				buffers.push(data);
			}

			const mergedBlob = new Blob(buffers);
			return URL.createObjectURL(mergedBlob);
		}

		(async function () {
			try {
				const [pckUrl, wasmUrl, gameSceneUrl] = await Promise.all([
					mergeFiles(getParts("index.pck", 1, 5)),
					mergeFiles(getParts("index.wasm", 1, 2)),
					mergeFiles(getParts("scenes/Game.tscn", 1, 2))
				]);

				window.fetch = async function (url, ...args) {
					const urlString =
						typeof url === "string"
							? url
							: url.url;

					if (urlString.endsWith("index.pck")) {
						return originalFetch(pckUrl, ...args);
					}

					if (urlString.endsWith("index.wasm")) {
						return originalFetch(wasmUrl, ...args);
					}

					if (urlString.endsWith("scenes/Game.tscn")) {
						return originalFetch(gameSceneUrl, ...args);
					}

					return originalFetch(url, ...args);
				};

				const statusOverlay =
					document.getElementById('status');

				const statusProgress =
					document.getElementById('status-progress');

				const statusNotice =
					document.getElementById('status-notice');

				let initializing = true;
				let statusMode = '';

				function setStatusMode(mode) {
					if (
						statusMode === mode ||
						!initializing
					) {
						return;
					}

					if (mode === 'hidden') {
						statusOverlay.remove();
						initializing = false;
						return;
					}

					statusOverlay.style.visibility = 'visible';

					statusProgress.style.display =
						mode === 'progress'
							? 'block'
							: 'none';

					statusNotice.style.display =
						mode === 'notice'
							? 'block'
							: 'none';

					statusMode = mode;
				}

				function setStatusNotice(text) {
					while (statusNotice.lastChild) {
						statusNotice.removeChild(
							statusNotice.lastChild
						);
					}

					const lines = text.split('\n');

					lines.forEach((line) => {
						statusNotice.appendChild(
							document.createTextNode(line)
						);

						statusNotice.appendChild(
							document.createElement('br')
						);
					});
				}

				function displayFailureNotice(err) {
					console.error(err);

					if (err instanceof Error) {
						setStatusNotice(err.message);
					} else if (typeof err === 'string') {
						setStatusNotice(err);
					} else {
						setStatusNotice(
							'An unknown error occurred.'
						);
					}

					setStatusMode('notice');
					initializing = false;
				}

				const missing =
					Engine.getMissingFeatures({
						threads:
							GODOT_THREADS_ENABLED,
					});

				if (missing.length !== 0) {

					if (
						GODOT_CONFIG['serviceWorker'] &&
						GODOT_CONFIG[
							'ensureCrossOriginIsolationHeaders'
						] &&
						'serviceWorker' in navigator
					) {

						let serviceWorkerRegistrationPromise;

						try {
							serviceWorkerRegistrationPromise =
								navigator.serviceWorker
									.getRegistration();
						} catch (err) {
							serviceWorkerRegistrationPromise =
								Promise.reject(
									new Error(
										'Service worker registration failed.'
									)
								);
						}

						Promise.race([
							serviceWorkerRegistrationPromise
								.then((registration) => {

									if (
										registration != null
									) {
										return Promise.reject(
											new Error(
												'Service worker already exists.'
											)
										);
									}

									return registration;
								})
								.then(() =>
									engine.installServiceWorker()
								),

							new Promise((resolve) => {
								setTimeout(
									() => resolve(),
									2000
								);
							}),
						])
							.then(() => {
								window.location.reload();
							})
							.catch((err) => {
								console.error(
									'Error while registering service worker:',
									err
								);
							});

					} else {

						const missingMsg =
							'Error\nThe following features required to run Godot projects on the Web are missing:\n';

						displayFailureNotice(
							missingMsg +
							missing.join('\n')
						);
					}

				} else {

					setStatusMode('progress');

					engine.startGame({
						'onProgress': function (
							current,
							total
						) {
							if (
								current > 0 &&
								total > 0
							) {
								statusProgress.value =
									current;

								statusProgress.max =
									total;
							} else {
								statusProgress.removeAttribute(
									'value'
								);

								statusProgress.removeAttribute(
									'max'
								);
							}
						},
					}).then(() => {
						setStatusMode('hidden');
					}, displayFailureNotice);
				}

			} catch (err) {

				console.error(err);

				const statusOverlay =
					document.getElementById('status');

				const statusProgress =
					document.getElementById('status-progress');

				const statusNotice =
					document.getElementById('status-notice');

				statusOverlay.style.visibility =
					'visible';

				statusProgress.style.display =
					'none';

				statusNotice.style.display =
					'block';

				statusNotice.textContent =
					err instanceof Error
						? err.message
						: 'Failed to load the game files.';
			}
		})();
	</script>

</body>
</html>
